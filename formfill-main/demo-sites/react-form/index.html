<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Form Test — FormFriend</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7ff;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      color: #1a1a2e;
    }
    .container {
      display: flex;
      gap: 24px;
      max-width: 900px;
      width: 100%;
      align-items: flex-start;
    }
    .form-card, .state-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px;
      flex: 1;
    }
    .state-card {
      position: sticky;
      top: 40px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #4361ee; }
    h2 { font-size: 16px; margin-bottom: 16px; color: #333; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
    .badge {
      display: inline-block; background: #e8f5e9; color: #2e7d32;
      padding: 4px 10px; border-radius: 12px; font-size: 11px;
      font-weight: 600; margin-bottom: 16px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600;
      color: #555; margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%; padding: 10px 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; color: #1a1a2e; transition: border-color 0.15s;
    }
    .form-group input:focus {
      outline: none; border-color: #4361ee;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    }
    .live-value {
      font-size: 11px; color: #4361ee; margin-top: 3px;
      font-family: 'Courier New', monospace;
    }
    button[type="submit"] {
      width: 100%; padding: 12px;
      background: #4361ee; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    button[type="submit"]:hover { background: #3a56d4; }
    .state-json {
      background: #f8f9ff; border: 1px solid #e0e3ff;
      border-radius: 8px; padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px; white-space: pre-wrap;
      word-break: break-all; line-height: 1.6;
      color: #333;
    }
    .state-json .key { color: #7b1fa2; }
    .state-json .value { color: #2e7d32; }
    .note {
      margin-top: 16px; padding: 12px; background: #fff3e0;
      border-radius: 8px; font-size: 12px; color: #ef6c00;
      line-height: 1.5;
    }
    .result {
      margin-top: 16px; padding: 12px; background: #e8f5e9;
      border-radius: 8px; font-size: 12px; display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="root" class="form-card"></div>
  </div>

  <!-- React via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function ReactFormTest() {
      const [formData, setFormData] = useState({
        fullName: '',
        email: '',
        phone: '',
        dateOfBirth: '',
        college: ''
      });
      const [submitted, setSubmitted] = useState(null);

      const handleChange = (field) => (e) => {
        setFormData(prev => ({ ...prev, [field]: e.target.value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitted({ ...formData });
      };

      const fields = [
        { key: 'fullName', label: 'Full Name', type: 'text', placeholder: 'Anant Agarwal' },
        { key: 'email', label: 'Email', type: 'email', placeholder: 'anant@example.com' },
        { key: 'phone', label: 'Phone Number', type: 'tel', placeholder: '+91 9876543210' },
        { key: 'dateOfBirth', label: 'Date of Birth', type: 'text', placeholder: 'DD/MM/YYYY' },
        { key: 'college', label: 'College', type: 'text', placeholder: 'CUSAT' }
      ];

      return (
        <div style={{ display: 'flex', gap: '24px', width: '100%' }}>
          {/* Form */}
          <div style={{ flex: 1 }}>
            <h1>React Form Test</h1>
            <p className="subtitle">Tests that FormFriend autofill works with React-controlled inputs</p>
            <span className="badge">React 18 — Controlled Components</span>

            <form onSubmit={handleSubmit}>
              {fields.map(f => (
                <div className="form-group" key={f.key}>
                  <label htmlFor={f.key}>{f.label}</label>
                  <input
                    type={f.type}
                    id={f.key}
                    name={f.key}
                    placeholder={f.placeholder}
                    value={formData[f.key]}
                    onChange={handleChange(f.key)}
                  />
                  <div className="live-value">
                    React state: "{formData[f.key]}"
                  </div>
                </div>
              ))}
              <button type="submit">Submit (React)</button>
            </form>

            {submitted && (
              <div className="result" style={{ display: 'block' }}>
                ✓ React form submitted with state values:
                {'\n\n' + JSON.stringify(submitted, null, 2)}
              </div>
            )}
          </div>

          {/* State display */}
          <div className="state-card" style={{ flex: '0 0 300px' }}>
            <h2>📊 Live React State</h2>
            <div className="state-json">
              {JSON.stringify(formData, null, 2)}
            </div>
            <div className="note">
              <strong>How to test:</strong><br/>
              1. Load FormFriend extension<br/>
              2. Create a profile in the popup<br/>
              3. Click "Scan This Page"<br/>
              4. Click "Review &amp; Fill"<br/>
              5. If the state panel updates → React compatibility works! ✓
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReactFormTest />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Edge Case Form</title></head>
<body>
  <form id="weird-form">
    <!-- Test 1: Hidden context in parent div -->
    <div>
      <h3>Guardian Details</h3>
      <label>Full Name</label>
      <input type="text" name="g_name" />
      
      <label>Contact Number</label>
      <input type="tel" name="g_phone" />
    </div>

    <!-- Test 2: Weird labels that mean standard things -->
    <fieldset>
      <legend>Candidate Info</legend>
      <label>Given Name</label>
      <input type="text" id="fn" />
      
      <label>Surname</label>
      <input type="text" id="ln" />
      
      <label>Electronic Mail</label>
      <input type="email" id="em" />
    </fieldset>

    <!-- Test 3: Education Context -->
    <div>
      <label>Institution Attended</label>
      <input type="text" />
      
      <label>Current Term / Semester</label>
      <input type="text" />
    </div>
  </form>
</body>
</html>

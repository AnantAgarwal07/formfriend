<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7ff;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      color: #1a1a2e;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 520px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #4361ee;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      color: #1a1a2e;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4361ee;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }
    button[type="submit"]:hover {
      background: #3a56d4;
    }
    .result {
      margin-top: 24px;
      padding: 16px;
      background: #e8f5e9;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Registration Form</h1>
    <p class="subtitle">Demo 1 — Basic form with standard labels</p>
    <span class="badge">FormFriend Demo</span>

    <form id="registration-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dateOfBirth">
      </div>
      <div class="form-group">
        <label for="college">College</label>
        <input type="text" id="college" name="college" placeholder="Your college name">
      </div>
      <button type="submit">Submit Registration</button>
    </form>

    <div class="result" id="result"></div>
  </div>

  <script>
    document.getElementById('registration-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {};
      const form = e.target;
      for (const el of form.elements) {
        if (el.name) data[el.name] = el.value;
      }
      const resultEl = document.getElementById('result');
      resultEl.style.display = 'block';
      resultEl.textContent = '✓ Form submitted with values:\n\n' + JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>

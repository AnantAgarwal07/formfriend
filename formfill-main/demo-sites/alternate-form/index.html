<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7ff;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      color: #1a1a2e;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 520px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #4361ee; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      color: #555; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    input, textarea, select {
      width: 100%; padding: 10px 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; color: #1a1a2e; transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: #4361ee;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    }
    button[type="submit"] {
      width: 100%; padding: 12px;
      background: #4361ee; color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    button[type="submit"]:hover { background: #3a56d4; }
    .result {
      margin-top: 24px; padding: 16px; background: #e8f5e9;
      border-radius: 8px; font-size: 13px; display: none;
      white-space: pre-wrap; word-break: break-all;
    }
    .badge {
      display: inline-block; background: #fff3e0; color: #ef6c00;
      padding: 4px 10px; border-radius: 12px; font-size: 11px;
      font-weight: 600; margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Application Portal</h1>
    <p class="subtitle">Demo 2 — Alternate wording to test semantic mapping</p>
    <span class="badge">Non-standard labels</span>

    <form id="application-form">
      <div class="form-group">
        <label for="applicant_identity">Applicant Identity</label>
        <input type="text" id="applicant_identity" name="applicant_identity" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label for="electronic_mail">Electronic Mail</label>
        <input type="email" id="electronic_mail" name="electronic_mail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label for="reach_me_at">Reach Me At</label>
        <input type="tel" id="reach_me_at" name="reach_me_at" placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label for="birth_info">Birth Information</label>
        <input type="text" id="birth_info" name="birth_info" placeholder="DD/MM/YYYY">
      </div>
      <div class="form-group">
        <label for="institution">Institution Attended</label>
        <input type="text" id="institution" name="institution" placeholder="College / University">
      </div>
      <button type="submit">Submit Application</button>
    </form>

    <div class="result" id="result"></div>
  </div>

  <script>
    document.getElementById('application-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = {};
      const form = e.target;
      for (const el of form.elements) {
        if (el.name) data[el.name] = el.value;
      }
      const resultEl = document.getElementById('result');
      resultEl.style.display = 'block';
      resultEl.textContent = '✓ Application submitted with values:\n\n' + JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
